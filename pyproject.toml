[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glia-shopify-sync"
version = "0.1.0"
description = "Sync Shopify donations (one-time and recurring) into ERPNext's Nonprofit module"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Glia" }]
keywords = ["shopify", "erpnext", "frappe", "donations", "nonprofit", "sync"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "requests>=2.32",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
]

# Phase 2+: CLI entry points (argparse + :main, matching the sibling project).
[project.scripts]
glia-sync-doctor = "glia_shopify_sync.doctor:main"
glia-sync-setup-erpnext = "glia_shopify_sync.setup_erpnext:main"
glia-sync-send-test = "glia_shopify_sync.send_test:main"

[project.urls]
Homepage = "https://github.com/glia/glia-shopify-erpnext"

[tool.hatch.build.targets.wheel]
packages = ["src/glia_shopify_sync"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in default arg
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.11"
warn_unreachable = true
warn_unused_ignores = false
ignore_missing_imports = true
files = ["src/glia_shopify_sync"]
# Relaxed for Phase 1; tighten as the codebase matures. Many errors come from
# third-party libs (requests, structlog, tenacity) that lack complete stubs.
disable_error_code = [
    "no-untyped-def",
    "no-any-return",
    "attr-defined",
    "union-attr",
    "assignment",
    "return-value",
    "unused-ignore",
    "type-arg",
]

[[tool.mypy.overrides]]
module = ["requests.*", "structlog.*", "tenacity.*", "yaml.*"]
ignore_missing_imports = true
