name: build-sync-image

# Build and publish the donation-sync image (for the daily CronJob) whenever the
# package changes. The Actions GITHUB_TOKEN has packages:write.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "src/**"
      - "config.example.yaml"
      - "pyproject.toml"
      - ".github/workflows/build-sync-image.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gliax/sync:latest
            ghcr.io/gliax/sync:0.1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
